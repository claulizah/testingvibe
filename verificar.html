<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="verify.title">Verificar un reporte — TestingVibe</title>
<meta name="description" content="Comprueba que un reporte fue emitido por TestingVibe usando su ID.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://testingvibe.com/verificar.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/config.js"></script>
<script src="/js/links.js"></script>
</head>
<body>
<header class="site-header">
  <div class="wrap bar">
    <a class="logo" href="/" aria-label="TestingVibe"><span>testing<b>vibe</b></span></a>
    <div class="lang" role="group" aria-label="Idioma" data-i18n-attr="aria-label:lang.label">
      <button type="button" data-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>
<main class="page">
  <div class="wrap prose">
    <p><a href="/" data-i18n="terms.back">← Volver al inicio</a></p>
    <h1 data-i18n="verify.h1">Verificar un reporte</h1>
    <p data-i18n="verify.p">Escribe el ID que aparece en tu reporte para confirmar que fue emitido por TestingVibe.</p>
    <form id="verify-form" class="form" novalidate>
      <label><span data-i18n="verify.label">ID del reporte</span>
        <input id="rid" name="id" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label>
      <button class="btn btn-primary" type="submit" data-i18n="verify.btn">Verificar</button>
    </form>
    <div id="verify-result" class="result" role="status" aria-live="polite"></div>
    <p class="byline" data-i18n="verify.note">Solo se muestran el ID, la fecha, el paquete y el veredicto. El contenido del reporte es confidencial.</p>
  </div>
</main>
<footer class="site-footer"><div class="wrap foot"><p>© <span id="year">2026</span> TestingVibe · <span data-i18n="foot.by">por Claudia Acosta</span></p></div></footer>
<script src="/js/i18n.js" defer></script>
<script src="/js/main.js" defer></script>
<script src="/js/verify.js" defer></script>
</body>
</html>
